<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Google Fonts: Space Grotesk and Space Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/styles/core.css">
  {% for sheet in page.extra_css %}<link rel="stylesheet" href="/styles/pages/{{ sheet }}.css">
  {% endfor -%}
  {% if page.noindex %}<meta name="robots" content="noindex, nofollow">
  {% endif -%}
</head>
