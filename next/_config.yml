title: Mokimo
description: Concept site — work in progress.

# Standalone concept site. This directory is excluded from the live build
# (see ../_config.yml) and is previewed separately. Port 8000 is the live
# site preview; 8001 is erpnext-mcp, so this uses 8002.
#
# Resource limits keep a runaway rebuild (or a bad file watch) from starving
# the other services on this host: 512m memory with swap capped to match (so
# it cannot fall back to swap), 1 CPU, and a PID cap. The log options stop the
# Docker json-file log growing without bound on a long-running server.
#
# Run detached, in the background, until stopped (then auto-removed, like
# jekyll-preview on 8000).
#
#   docker run -d --rm --name jekyll-preview-concept \
#     --publish 8002:4000 \
#     --volume /home/tom/mokimo/services/website/next:/srv/jekyll \
#     --workdir /srv/jekyll \
#     --memory 512m --memory-swap 512m \
#     --cpus 1 --pids-limit 256 \
#     --log-opt max-size=10m --log-opt max-file=3 \
#     jekyll/jekyll:latest \
#     jekyll serve --host 0.0.0.0 --disable-disk-cache --destination /tmp/_site

markdown: kramdown
exclude:
  - readme.md
